name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest entry must equal package.json engines.node — validate.js checks it.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Repo consistency checks
        run: node scripts/validate.js
      - name: Tests (CLI + install from packed tarball)
        run: npm test
      - name: Installer smoke test
        run: |
          node bin/cli.js init "$RUNNER_TEMP/smoke" --editor all
          test -f "$RUNNER_TEMP/smoke/AGENTS.md"
          test -f "$RUNNER_TEMP/smoke/CLAUDE.md"
          test -f "$RUNNER_TEMP/smoke/.cursor/rules/project.mdc"
          test -d "$RUNNER_TEMP/smoke/.ai/skills"
          node bin/cli.js init "$RUNNER_TEMP/smoke" --dry-run
          node bin/cli.js --version
